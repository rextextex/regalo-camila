    <script>


        /*
         * TEXTOS DE CADA BOTÓN
         */

        const textos = [

            "Hace un mes comenzó nuestro camino juntos, y caminarlo contigo me llena de ilusion.",

            "Tu sonrisa es la mas hermosa del mundo, la unica que calma mi corazon .",

            "En tu ser encontre la unica persona que puede saber todo de mi.",

            "No existe un recuerdo favorito pues todos son los mejores si estoy a tu lado.",

            "Admiro tu forma de ver la vida, tu ternura y la fuerza que me inspiras.",

            "Prometo cuidar este amor, respetarlo y hacerlo crecer cada día.",

            "Nuestro futuro sera siempre brillante, pues siempre estaremos juntos.",

            "El amor que nos tenemos es el mejor porque se fortalece con cada momento compartido. "

        ];


        /*
         * CAMBIAR ESTADO DEL BOTÓN
         *
         * Estado 0:
         * Imagen local
         *
         * Estado 1:
         * Texto
         *
         * Estado 2:
         * Foto desde R2
         *
         * Después vuelve al Estado 0.
         */

        function cambiarEstado(boton) {


            /*
             * Evita varios clics durante el giro.
             */

            if (boton.dataset.animando === "true") {

                return;

            }


            boton.dataset.animando = "true";


            /*
             * Suma una vuelta completa
             * en cada clic.
             */

            let giros =
                Number(boton.dataset.giros);

            giros++;

            boton.dataset.giros =
                giros;


            boton.style.transform =
                `rotateY(${giros * 360}deg)`;


            /*
             * Cambiar al siguiente estado.
             */

            let estado =
                Number(boton.dataset.estado);

            estado++;


            if (estado > 2) {

                estado = 0;

            }


            boton.dataset.estado =
                estado;


            /*
             * Obtener el contenido
             * del botón.
             */

            const contenido =
                boton.querySelector(
                    ".contenido-boton"
                );


            /*
             * Saber qué número de botón
             * estamos utilizando.
             */

            const numero =
                Number(boton.dataset.numero);


            /*
             * =========================
             * ESTADO 0
             * IMAGEN LOCAL
             * =========================
             */

            if (estado === 0) {


                contenido.innerHTML = `

                    <img
                        src="imagenes/imagen${numero}.jpg"
                        alt="Imagen ${numero}"
                    >

                `;

            }


            /*
             * =========================
             * ESTADO 1
             * TEXTO
             * =========================
             */

            else if (estado === 1) {


                contenido.innerHTML = `

                    <div class="texto-romantico">

                        ${textos[numero - 1]}

                    </div>

                `;

            }


            /*
             * =========================
             * ESTADO 2
             * FOTO DESDE R2
             * =========================
             */

            else if (estado === 2) {


                contenido.innerHTML = `

                    <img
                        src="/fotos/05-10-2026/foto${numero}.jpg"
                        alt="Foto ${numero}"
                    >

                `;

            }


            /*
             * Permitir otro clic después
             * de terminar el giro.
             */

            setTimeout(() => {

                boton.dataset.animando =
                    "false";

            }, 350);

        }


    </script>
