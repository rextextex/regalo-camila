<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fechas importantes</title>


    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            overflow-x: hidden;

            background-image:
                url("imagenes/fondo-inicio.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

        }


        /* =====================================================
           CONTENEDOR PRINCIPAL
           ===================================================== */

        .inicio-prueba {

            min-height: 100vh;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 80px 20px;

        }


        /* =====================================================
           COLUMNA CENTRAL
           ===================================================== */

        .zona-central {

            position: relative;

            z-index: 10;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 18px;

            width: 400px;

        }


        /* =====================================================
           TÍTULO
           ===================================================== */

        .titulo {

            text-align: center;

            margin-bottom: 8px;

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        .titulo h1 {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 48px;

            line-height: 1.1;

            font-weight: bold;

            color: #6d2037;

            white-space: nowrap;

            text-shadow:
                -2px -2px 0 white,
                 2px -2px 0 white,
                -2px  2px 0 white,
                 2px  2px 0 white,
                 0 3px 6px rgba(0,0,0,0.20);

        }


        /* =====================================================
           SUBTÍTULO
           ===================================================== */

        .titulo p {

            margin-top: 7px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 25px;

            color: #c84d6b;

            font-style: italic;

            font-weight: bold;

            white-space: nowrap;

            text-shadow:
                -1px -1px 0 white,
                 1px -1px 0 white,
                -1px  1px 0 white,
                 1px  1px 0 white,
                 0 2px 4px rgba(0,0,0,0.15);

        }


        /* =====================================================
           BOTONES
           ===================================================== */

        .boton-recuerdo {

            width: 330px;

            height: 70px;

            border: none;

            border-radius: 12px;

            font-size: 21px;

            color: black;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.18);

            transition:
                transform 0.2s,
                box-shadow 0.2s;

        }


        .boton-recuerdo:hover {

            transform: scale(1.04);

            box-shadow:
                0 12px 25px
                rgba(0, 0, 0, 0.25);

        }


        /* =====================================================
           BOTÓN 05/09
           ===================================================== */

        .boton-0509 {

            background-image:
                url("imagenes/b1.png");

            background-size: cover;

            background-position: center;

            color: black;

        }


        /* =====================================================
           BOTÓN 21/09
           ===================================================== */

        .boton-2109 {

            background-image:
                url("imagenes/b2.png");

            background-size: cover;

            background-position: center;

            color: black;

        }


        /* =====================================================
           BOTONES VACÍOS
           ===================================================== */

        .boton-vacio {

            background:
                rgba(255, 255, 255, 0.78);

        }


        /* =====================================================
           CONTENEDORES LATERALES
           ===================================================== */

        .fotos-laterales {

            position: absolute;

            top: 0;

            bottom: 0;

            width: 36%;

            z-index: 3;

            pointer-events: none;

        }


        /* =====================================================
           FOTOS
           ===================================================== */

        .foto {

            position: absolute;

            width: 230px;

            aspect-ratio: 1 / 1;

            padding: 7px;

            background: white;

            border-radius: 8px;

            overflow: hidden;

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.20);

        }


        .foto img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 4px;

        }


        /* =====================================================
           FOTOS IZQUIERDA
           INCLINACIÓN INVERTIDA
           ===================================================== */

        /* =====================================================
   FOTOS IZQUIERDA
   ===================================================== */

        .fotos-izquierda {
            transform: translateX(-520px);
        }

        /* =========================
        FOTOS IZQUIERDA
        ========================= */

        .fotos-izquierda .foto-1 {
            top: 4%;
            right: 17%;
            transform: rotate(8deg);
        }

        .fotos-izquierda .foto-2 {
            top: 28%;
            right: -2%;
            transform: rotate(-6deg);
        }

        .fotos-izquierda .foto-3 {
            top: 53%;
            right: 17%;
            transform: rotate(5deg);
        }

        .fotos-izquierda .foto-4 {
            top: 77%;
            right: -2%;
            transform: rotate(-8deg);
        }


        /* =========================
        COLUMNA DERECHA
        ========================= */

        .fotos-derecha {
            transform: translateX(520px);
        }


        /* =========================
        FOTOS DERECHA
        ========================= */

        .fotos-derecha .foto-1 {
            top: 4%;
            left: 17%;
            transform: rotate(-8deg);
        }

        .fotos-derecha .foto-2 {
            top: 28%;
            left: 2%;
            transform: rotate(6deg);
        }

        .fotos-derecha .foto-3 {
            top: 53%;
            left: 17%;
            transform: rotate(-5deg);
        }

        .fotos-derecha .foto-4 {
            top: 77%;
            left: 2%;
            transform: rotate(8deg);
        }

        /* =====================================================
           FRASE FINAL
           ===================================================== */

        .frase-final {

            width: 560px;

            max-width: 100%;

            margin-top: 22px;

            text-align: center;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 26px;

            line-height: 1.35;

            font-style: italic;

            font-weight: bold;

            color: #7a1738;

            text-shadow:
                -1px -1px 0 white,
                 1px -1px 0 white,
                -1px  1px 0 white,
                 1px  1px 0 white,
                 0 2px 4px rgba(0,0,0,0.12);

        }


        /* =====================================================
           BOTÓN CERRAR SESIÓN
           ===================================================== */

        .boton-cerrar {

            position: fixed;

            top: 20px;

            right: 20px;

            z-index: 20;

            width: 150px;

            height: 50px;

            border: none;

            border-radius: 10px;

            background: #b83b5e;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 6px 15px
                rgba(0, 0, 0, 0.20);

        }


        .boton-cerrar:hover {

            background-color: #962f4d;

        }


        /* =====================================================
           PANTALLAS GRANDES / MEDIANAS
           ===================================================== */

        @media (max-width: 1250px) {

            .foto {

                width: 190px;

            }


            .fotos-laterales {

                width: 30%;

            }


            .fotos-izquierda .foto-1,
            .fotos-izquierda .foto-3 {

                right: 2%;

            }


            .fotos-izquierda .foto-2,
            .fotos-izquierda .foto-4 {

                right: 12%;

            }


            .fotos-derecha .foto-1,
            .fotos-derecha .foto-3 {

                left: 2%;

            }


            .fotos-derecha .foto-2,
            .fotos-derecha .foto-4 {

                left: 12%;

            }


            .titulo h1 {

                font-size: 42px;

            }


            .titulo p {

                font-size: 22px;

            }


            .frase-final {

                width: 500px;

                font-size: 24px;

            }

        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 900px) {

            .inicio-prueba {

                padding:
                    80px 10px;

            }


            .zona-central {

                width: 330px;

            }


            .titulo h1 {

                font-size: 34px;

            }


            .titulo p {

                font-size: 19px;

            }


            .boton-recuerdo {

                width: 280px;

                height: 62px;

                font-size: 19px;

            }


            .foto {

                width: 140px;

            }


            .fotos-laterales {

                width: 24%;

            }


            .fotos-izquierda .foto-2,
            .fotos-izquierda .foto-4 {

                right: 4%;

            }


            .fotos-derecha .foto-2,
            .fotos-derecha .foto-4 {

                left: 4%;

            }


            .frase-final {

                width: 430px;

                font-size: 22px;

            }

        }


        /* =====================================================
           CELULAR
           ===================================================== */

        @media (max-width: 700px) {

            .inicio-prueba {

                align-items: flex-start;

                padding:
                    100px 15px 50px;

            }


            .zona-central {

                width: 100%;

            }


            .titulo {

                margin-bottom: 10px;

            }


            .titulo h1 {

                font-size: 27px;

                white-space: nowrap;

            }


            .titulo p {

                font-size: 17px;

                white-space: nowrap;

            }


            .boton-recuerdo {

                width: 90%;

                max-width: 330px;

                height: 65px;

            }


            .fotos-laterales {

                width: 25%;

            }


            .foto {

                width: 100px;

                padding: 4px;

            }


            .fotos-izquierda .foto-1 {

                top: 10%;

                right: 2%;

            }


            .fotos-izquierda .foto-2 {

                top: 33%;

                right: 7%;

            }


            .fotos-izquierda .foto-3 {

                top: 56%;

                right: 2%;

            }


            .fotos-izquierda .foto-4 {

                top: 79%;

                right: 7%;

            }


            .fotos-derecha .foto-1 {

                top: 10%;

                left: 2%;

            }


            .fotos-derecha .foto-2 {

                top: 33%;

                left: 7%;

            }


            .fotos-derecha .foto-3 {

                top: 56%;

                left: 2%;

            }


            .fotos-derecha .foto-4 {

                top: 79%;

                left: 7%;

            }


            .frase-final {

                width: 95%;

                font-size: 20px;

                line-height: 1.4;

                margin-top: 20px;

                white-space: normal;

            }


            .boton-cerrar {

                width: 125px;

                height: 45px;

                top: 15px;

                right: 15px;

                font-size: 14px;

            }

        }

    </style>

</head>


<body>


    <main class="inicio-prueba">


        <!-- =================================================
             FOTOS IZQUIERDA — R2
             ================================================= -->

        <div class="fotos-laterales fotos-izquierda">


            <div class="foto foto-1">

                <img
                    src="/fotos/inicio/foto1.jpg"
                    alt="Foto 1"
                >

            </div>


            <div class="foto foto-2">

                <img
                    src="/fotos/inicio/foto2.jpg"
                    alt="Foto 2"
                >

            </div>


            <div class="foto foto-3">

                <img
                    src="/fotos/inicio/foto3.jpg"
                    alt="Foto 3"
                >

            </div>


            <div class="foto foto-4">

                <img
                    src="/fotos/inicio/foto4.jpg"
                    alt="Foto 4"
                >

            </div>


        </div>


        <!-- =================================================
             COLUMNA CENTRAL
             ================================================= -->

        <div class="zona-central">


            <!-- =================================================
                 TÍTULO
                 ================================================= -->

            <div class="titulo">

                <h1>
                    Fechas importantes
                </h1>

                <p>
                    con la mejor mujer del mundo
                </p>

            </div>


            <!-- =================================================
                 BOTÓN 05/09
                 ================================================= -->

            <button
                class="boton-recuerdo boton-0509"
                onclick="window.location.href='recuerdo-0509.html'"
            >
                05/09/2026
            </button>


            <!-- =================================================
                 BOTÓN 21/09
                 ================================================= -->

            <button
                class="boton-recuerdo boton-2109"
                onclick="window.location.href='recuerdo-2109.html'"
            >
                21/09/2026
            </button>


            <!-- =================================================
                 BOTONES FUTUROS
                 ================================================= -->

            <button class="boton-recuerdo boton-vacio">
                -----
            </button>


            <button class="boton-recuerdo boton-vacio">
                -----
            </button>


            <button class="boton-recuerdo boton-vacio">
                -----
            </button>


            <button class="boton-recuerdo boton-vacio">
                -----
            </button>


            <button class="boton-recuerdo boton-vacio">
                -----
            </button>


            <button class="boton-recuerdo boton-vacio">
                -----
            </button>


            <button class="boton-recuerdo boton-vacio">
                -----
            </button>


            <button class="boton-recuerdo boton-vacio">
                -----
            </button>


            <!-- =================================================
                 FRASE FINAL
                 ================================================= -->

            <p class="frase-final">

                “Porque cualquier momento se vuelve especial
                <br>
                y hermoso cuando estoy contigo.”

            </p>


        </div>


        <!-- =================================================
             FOTOS DERECHA — R2
             ================================================= -->

        <div class="fotos-laterales fotos-derecha">


            <div class="foto foto-1">

                <img
                    src="/fotos/inicio/foto5.jpg"
                    alt="Foto 5"
                >

            </div>


            <div class="foto foto-2">

                <img
                    src="/fotos/inicio/foto6.jpg"
                    alt="Foto 6"
                >

            </div>


            <div class="foto foto-3">

                <img
                    src="/fotos/inicio/foto7.jpg"
                    alt="Foto 7"
                >

            </div>


            <div class="foto foto-4">

                <img
                    src="/fotos/inicio/foto8.jpg"
                    alt="Foto 8"
                >

            </div>


        </div>


    </main>


    <!-- =====================================================
         CERRAR SESIÓN
         ===================================================== -->

    <button
        class="boton-cerrar"
        onclick="cerrarSesion()"
    >
        Cerrar sesión
    </button>


    <script>

        async function cerrarSesion() {

            try {

                await fetch(
                    "/logout",
                    {
                        method: "POST"
                    }
                );

            } finally {

                window.location.href =
                    "index.html";

            }

        }

    </script>


</body>

</html>
