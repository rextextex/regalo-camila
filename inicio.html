<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fechas importantes</title>

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            background-image:
                url("imagenes/fondo-inicio.jpg");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            font-family: Arial, sans-serif;

            overflow-x: hidden;
        }


        /* =========================
           BOTÓN CERRAR SESIÓN
           ========================= */

        .cerrar-sesion {

            position: fixed;

            top: 20px;
            right: 20px;

            padding: 10px 18px;

            border: none;

            border-radius: 8px;

            background: #b83b5e;

            color: white;

            font-size: 14px;

            cursor: pointer;

            z-index: 1000;

            transition: 0.2s;
        }


        .cerrar-sesion:hover {

            background: #962f4d;
        }


        /* =========================
           CONTENEDOR PRINCIPAL
           ========================= */

        .contenedor {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

            padding: 50px 20px;
        }


        /* =========================
           FOTOS LATERALES
           ========================= */

        .fotos-laterales {

            position: absolute;

            top: 0;
            bottom: 0;

            width: 36%;

            pointer-events: none;
        }


        .fotos-izquierda {

            left: 0;

            transform: translateX(-350px);
        }


        .fotos-derecha {

            right: 0;

            transform: translateX(350px);
        }


        .foto {

            position: absolute;

            width: 230px;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            border: 7px solid white;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.25);

            background: white;
        }


        /* =========================
           FOTOS IZQUIERDA
           ========================= */

        .fotos-izquierda .foto-1 {

            top: 4%;

            right: 17%;

            transform: rotate(8deg);
        }


        .fotos-izquierda .foto-2 {

            top: 28%;

            right: -2%;

            transform: rotate(-6deg);
        }


        .fotos-izquierda .foto-3 {

            top: 53%;

            right: 17%;

            transform: rotate(5deg);
        }


        .fotos-izquierda .foto-4 {

            top: 77%;

            right: -2%;

            transform: rotate(-8deg);
        }


        /* =========================
           FOTOS DERECHA
           ========================= */

        .fotos-derecha .foto-1 {

            top: 4%;

            left: 17%;

            transform: rotate(-8deg);
        }


        .fotos-derecha .foto-2 {

            top: 28%;

            left: 2%;

            transform: rotate(6deg);
        }


        .fotos-derecha .foto-3 {

            top: 53%;

            left: 17%;

            transform: rotate(-5deg);
        }


        .fotos-derecha .foto-4 {

            top: 77%;

            left: 2%;

            transform: rotate(8deg);
        }


        /* =========================
           ZONA CENTRAL
           ========================= */

        .zona-central {

            position: relative;

            z-index: 10;

            width: 400px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        /* =========================
           TÍTULO
           ========================= */

        .titulo {

            text-align: center;

            margin-bottom: 8px;

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        .titulo h1 {

            margin: 0;

            color: #6d2037;

            font-size: 48px;

            font-weight: bold;

            line-height: 1.1;

            white-space: nowrap;

            text-shadow:
                -2px -2px 0 white,
                 2px -2px 0 white,
                -2px  2px 0 white,
                 2px  2px 0 white,
                 0 0 4px white;
        }


        .titulo p {

            margin: 8px 0 0;

            color: #c84d6b;

            font-size: 25px;

            font-weight: bold;

            font-style: italic;

            line-height: 1.2;

            white-space: nowrap;

            text-shadow:
                -2px -2px 0 white,
                 2px -2px 0 white,
                -2px  2px 0 white,
                 2px  2px 0 white,
                 0 0 4px white;
        }


        /* =========================
           BOTONES
           ========================= */

        .botones {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 12px;

            margin-top: 25px;
        }


        .boton-fecha {

            width: 250px;

            height: 50px;

            border: none;

            border-radius: 8px;

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            color: black;

            font-size: 16px;

            font-weight: normal;

            cursor: pointer;

            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.15);

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }


        .boton-fecha:hover {

            transform: scale(1.03);

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.25);
        }


        .boton-1 {

            background-image:
                url("imagenes/b1.png");
        }


        .boton-2 {

            background-image:
                url("imagenes/b2.png");
        }


        .boton-vacio {

            background: rgba(255, 255, 255, 0.75);

            cursor: default;
        }


        .boton-vacio:hover {

            transform: none;

            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.15);
        }


        /* =========================
           FRASE FINAL
           ========================= */

        .frase-final {

            margin-top: 30px;

            width: 600px;

            max-width: 90vw;

            text-align: center;

            color: #7a1738;

            font-size: 24px;

            font-weight: bold;

            font-style: italic;

            line-height: 1.35;

            text-shadow:
                -2px -2px 0 white,
                 2px -2px 0 white,
                -2px  2px 0 white,
                 2px  2px 0 white,
                 0 0 4px white;
        }


        /* =========================
           TABLET
           ========================= */

        @media (max-width: 1200px) {

            .foto {

                width: 140px;
            }


            .fotos-izquierda {

                transform: translateX(-350px);
            }


            .fotos-derecha {

                transform: translateX(350px);
            }


            .titulo h1 {

                font-size: 40px;
            }


            .titulo p {

                font-size: 22px;
            }
        }


        /* =========================
           CELULAR
           ========================= */

        @media (max-width: 700px) {

            body {

                background-attachment: scroll;
            }


            .contenedor {

                padding:
                    80px 15px 40px;
            }


            .fotos-laterales {

                width: 30%;
            }


            .fotos-izquierda {

                transform: translateX(-80px);
            }


            .fotos-derecha {

                transform: translateX(80px);
            }


            .foto {

                width: 100px;

                border-width: 5px;
            }


            .titulo h1 {

                font-size: 30px;

                white-space: nowrap;
            }


            .titulo p {

                font-size: 17px;

                white-space: nowrap;
            }


            .zona-central {

                width: 100%;

                max-width: 400px;
            }


            .boton-fecha {

                width: 220px;

                height: 48px;
            }


            .frase-final {

                font-size: 19px;

                width: 90vw;
            }


            .cerrar-sesion {

                top: 10px;

                right: 10px;

                font-size: 12px;

                padding: 8px 12px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         BOTÓN CERRAR SESIÓN
         ========================= -->

    <button
        class="cerrar-sesion"
        onclick="cerrarSesion()"
    >
        Cerrar sesión
    </button>


    <main class="contenedor">


        <!-- =========================
             FOTOS IZQUIERDA
             ========================= -->

        <div class="fotos-laterales fotos-izquierda">

            <img
                class="foto foto-1"
                src="/fotos/inicio/foto-prueba-1.jpg"
                alt="Foto 1"
            >

            <img
                class="foto foto-2"
                src="/fotos/inicio/foto-prueba-2.jpg"
                alt="Foto 2"
            >

            <img
                class="foto foto-3"
                src="/fotos/inicio/foto-prueba-3.jpg"
                alt="Foto 3"
            >

            <img
                class="foto foto-4"
                src="/fotos/inicio/foto-prueba-4.jpg"
                alt="Foto 4"
            >

        </div>


        <!-- =========================
             ZONA CENTRAL
             ========================= -->

        <section class="zona-central">


            <div class="titulo">

                <h1>
                    Fechas importantes
                </h1>

                <p>
                    con la mejor mujer del mundo
                </p>

            </div>


            <div class="botones">


                <a
                    href="recuerdo-0509.html"
                    class="boton-fecha boton-1"
                >
                    05/09/2026
                </a>


                <a
                    href="recuerdo-2109.html"
                    class="boton-fecha boton-2"
                >
                    21/09/2026
                </a>


                <div class="boton-fecha boton-vacio">
                    -----
                </div>


                <div class="boton-fecha boton-vacio">
                    -----
                </div>


                <div class="boton-fecha boton-vacio">
                    -----
                </div>


                <div class="boton-fecha boton-vacio">
                    -----
                </div>


                <div class="boton-fecha boton-vacio">
                    -----
                </div>


                <div class="boton-fecha boton-vacio">
                    -----
                </div>


                <div class="boton-fecha boton-vacio">
                    -----
                </div>


                <div class="boton-fecha boton-vacio">
                    -----
                </div>


            </div>


            <div class="frase-final">

                “Porque cualquier momento se vuelve especial
                <br>
                y hermoso cuando estoy contigo.”

            </div>


        </section>


        <!-- =========================
             FOTOS DERECHA
             ========================= -->

        <div class="fotos-laterales fotos-derecha">

            <img
                class="foto foto-1"
                src="/fotos/inicio/foto-prueba-5.jpg"
                alt="Foto 5"
            >

            <img
                class="foto foto-2"
                src="/fotos/inicio/foto-prueba-6.jpg"
                alt="Foto 6"
            >

            <img
                class="foto foto-3"
                src="/fotos/inicio/foto-prueba-7.jpg"
                alt="Foto 7"
            >

            <img
                class="foto foto-4"
                src="/fotos/inicio/foto-prueba-8.jpg"
                alt="Foto 8"
            >

        </div>


    </main>


    <script>

        async function cerrarSesion() {

            try {

                await fetch(
                    "/logout",
                    {
                        method: "POST"
                    }
                );

            } finally {

                window.location.href =
                    "index.html";
            }
        }

    </script>


</body>

</html>
