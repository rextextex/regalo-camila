<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fechas importantes</title>

    <link rel="stylesheet" href="estilo.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("imagenes/fondo-inicio.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }

        .cerrar-sesion {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 18px;
            background-color: #8f4a5c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 10;
        }

        .pagina-botones {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .titulo {
            text-align: center;
            margin-bottom: 25px;
        }

        .titulo h1 {
            margin: 0;
            font-size: 36px;
            color: #000;
        }

        .titulo p {
            margin-top: 8px;
            font-size: 20px;
            color: #000;
        }

        .botones {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1200px;
        }

        .boton-fecha {
            width: 320px;
            height: 65px;
            border-radius: 10px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;
            color: black;
            font-size: 20px;
            font-weight: bold;

            box-sizing: border-box;
        }

        .boton-1 {
            background-image: url("imagenes/b1.png");
        }

        .boton-2 {
            background-image: url("imagenes/b2.png");
        }

        .boton-3 {
            background-image: url("imagenes/b3.png");
        }

        .boton-vacio {
            background-color: rgba(255, 255, 255, 0.45);
        }

        .frase-final {
            margin-top: 25px;
            text-align: center;
            font-size: 18px;
            color: #000;
        }

        @media (max-width: 1200px) {
            .boton-fecha {
                width: 280px;
                height: 60px;
            }
        }

        @media (max-width: 700px) {
            .boton-fecha {
                width: 250px;
                height: 55px;
                font-size: 17px;
            }

            .titulo h1 {
                font-size: 30px;
            }

            .titulo p {
                font-size: 17px;
            }

            .frase-final {
                font-size: 16px;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <button class="cerrar-sesion" onclick="cerrarSesion()">
        Cerrar sesión
    </button>

    <div class="pagina-botones">

        <div class="titulo">
            <h1>FECHAS IMPORTANTES</h1>
            <p>con la mejor mujer del mundo</p>
        </div>

        <div class="botones">

            <!-- 1 -->
            <a href="recuerdo-0509.html" class="boton-fecha boton-1">
                05/09/2026
            </a>

            <!-- 2 -->
            <a href="recuerdo-2109.html" class="boton-fecha boton-2">
                21/09/2026
            </a>

            <!-- 3 -->
            <a href="recuerdo-0510.html" class="boton-fecha boton-3">
                05/10/2026
            </a>

            <!-- 4 -->
            <div class="boton-fecha boton-vacio">
                -----
            </div>

            <!-- 5 -->
            <div class="boton-fecha boton-vacio">
                -----
            </div>

            <!-- 6 -->
            <div class="boton-fecha boton-vacio">
                -----
            </div>

            <!-- 7 -->
            <div class="boton-fecha boton-vacio">
                -----
            </div>

            <!-- 8 -->
            <div class="boton-fecha boton-vacio">
                -----
            </div>

            <!-- 9 -->
            <div class="boton-fecha boton-vacio">
                -----
            </div>

            <!-- 10 -->
            <div class="boton-fecha boton-vacio">
                -----
            </div>

        </div>

        <div class="frase-final">
            Porque cualquier momento se vuelve especial y hermoso cuando estoy contigo.
        </div>

    </div>

    <script>
        async function cerrarSesion() {
            try {
                await fetch("/logout", {
                    method: "POST"
                });

                window.location.href = "/";
            } catch (error) {
                console.error("Error al cerrar sesión:", error);
            }
        }
    </script>

</body>
</html>
